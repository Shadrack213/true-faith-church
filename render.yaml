# Render Blueprint for the True Faith Church International Django API.
# Render reads this file when you choose New > Blueprint and pick this repository.
#
# NO SECRETS IN THIS FILE. Values marked "sync: false" are typed into Render's
# dashboard during set-up (copy them from your private backend/.env), and
# DJANGO_SECRET_KEY is generated by Render itself.
services:
  - type: web
    name: tfci-api
    runtime: python
    plan: free
    region: frankfurt            # closest Render region to the Supabase project (eu-west-3, Paris)
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true      # Render creates a random secret key
      - key: DJANGO_ADMIN_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://shadrack213.github.io
      # Supabase (public, non-secret values)
      - key: SUPABASE_PROJECT_REF
        value: xklcckiwwkbbojwzjdcy
      - key: SUPABASE_STORAGE_BUCKET
        value: event-flyers
      - key: SUPABASE_STORAGE_REGION
        value: eu-west-3
      # Secrets: entered in the Render dashboard, never stored in the repository
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
